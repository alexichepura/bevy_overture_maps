[package]
name = "bevy_overture_maps"
version = "0.3.2"
edition = "2021"

[profile.release]
codegen-units = 1

[workspace]
resolver = "2"
members = ["app", "cli"]

[workspace.dependencies]
arrow = { version = "58.1.0", features = [
"ipc",
"test_utils",
"prettyprint",
"json",
] }
bevy = { version = "0.18", features = ["jpeg"] }
bevy_asset = "0.18"
bevy_mesh = "0.18"
duckdb = { git = "https://github.com/duckdb/duckdb-rs", features = [
] } # arrow 44
# geo = { version = "0.26.0", features = [] }
geo = { git = "https://github.com/georust/geo" }          # Vector2DOps
geozero = { version = "0.15.1", features = ["with-wkb"] }
geo-types = { version = "0.7.11" }
parquet = "58.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.28" }

[dependencies]
arrow = { workspace = true }
bevy = { workspace = true }
bevy_asset = { workspace = true }
bevy_mesh = { workspace = true }
duckdb = { workspace = true }
geo = { workspace = true }
geozero = { workspace = true }
geo-types = { workspace = true }
parquet = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = "0.28"
strum_macros = "0.28"
